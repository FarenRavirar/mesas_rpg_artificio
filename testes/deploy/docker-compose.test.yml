services:
  test-pg:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: testpw
      POSTGRES_USER: admin
      POSTGRES_DB: mesas_rpg
    ports:
      - "${TEST_PG_PORT:-54329}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mesas_rpg"]
      interval: 2s
      timeout: 3s
      retries: 15
