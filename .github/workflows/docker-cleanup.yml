name: Docker Cleanup

on:
  schedule:
    # Roda todo domingo às 3h da manhã (UTC)
    - cron: '0 3 * * 0'
  workflow_dispatch: # Permite executar manualmente

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Cleanup Docker Images on Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          script: |
            echo "🧹 Iniciando limpeza de imagens Docker..."
            
            # Remover imagens dangling (sem tag)
            docker image prune -f
            
            # Remover containers parados
            docker container prune -f
            
            # CORREÇÃO Bug #8: Volume prune removido — pode deletar dados de containers parados
            # Se o banco estiver parado durante a limpeza, o volume seria deletado
            # Para limpar volumes manualmente: docker volume ls e docker volume rm <nome>
            
            # Remover networks não utilizadas
            docker network prune -f
            
            # Remover build cache
            docker builder prune -f
            
            # Manter apenas as 3 últimas versões de cada imagem
            echo "🗑️ Removendo imagens antigas (mantendo 3 mais recentes)..."
            
            # Para cada repositório de imagem, manter apenas as 3 mais recentes
            docker images --format "{{.Repository}}" | sort -u | while read repo; do
              if [ "$repo" != "<none>" ]; then
                docker images "$repo" --format "{{.ID}} {{.CreatedAt}}" | \
                  sort -k2 -r | \
                  tail -n +4 | \
                  awk '{print $1}' | \
                  xargs -r docker rmi -f 2>/dev/null || true
              fi
            done
            
            echo "✅ Limpeza concluída!"
            echo ""
            echo "📊 Espaço em disco após limpeza:"
            df -h /var/lib/docker
            echo ""
            echo "🐳 Imagens restantes:"
            docker images
      
      - name: Notify Success
        if: success()
        run: echo "✅ Limpeza de Docker concluída com sucesso!"
      
      - name: Notify Failure
        if: failure()
        run: echo "❌ Falha na limpeza de Docker!"
