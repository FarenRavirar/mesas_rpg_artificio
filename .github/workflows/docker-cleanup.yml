# ============================================================================
# WORKFLOW: Docker Cleanup
# RESPONSIBILITY: Maintenance
# TRIGGER: Agendado (Sundays 3 AM UTC) ou manual
# SCOPE: Limpeza periódica de recursos Docker no servidor
# DEPENDENCIES: Nenhuma
# CONSUMERS: Nenhum
# MAINTAINER: Equipe de operações
# LAST UPDATED: 2026-04-23
# NOTES: Mantém apenas 3 imagens mais recentes por repositório
# ============================================================================

name: Docker Cleanup

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup Docker on Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker image prune -f
            docker container prune -f
            docker builder prune -f
            docker network prune -f
            docker images --format "{{.Repository}}" | sort -u | while read repo; do
              if [ "$repo" != "<none>" ]; then
                docker images "$repo" --format "{{.ID}} {{.CreatedAt}}" | \
                  sort -k2 -r | tail -n +4 | awk '{print $1}' | \
                  xargs -r docker rmi -f 2>/dev/null || true
              fi
            done
            df -h /var/lib/docker

      - name: Notify Success
        if: success()
        run: echo "✅ Limpeza concluída!"

      - name: Notify Failure
        if: failure()
        run: echo "❌ Limpeza falhou!"