name: Deploy Beta

on:
  push:
    branches:
      - dev

jobs:
  deploy-beta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Beta Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GH_TOKEN
          script: |
            # CORREÇÃO WF-03: Adicionar fail-fast para evitar erros silenciosos
            set -euo pipefail
            export GH_TOKEN="${{ secrets.GH_TOKEN }}"
            cd /opt/mesas-beta
            git fetch https://$GH_TOKEN@github.com/FarenRavirar/mesas_rpg_artificio.git dev
            git reset --hard FETCH_HEAD
            
            # CORREÇÃO: Remover containers órfãos antes do down para evitar conflitos de nome
            docker ps -a --filter "name=mesas-beta" --format "{{.Names}}" | grep -v -E "(mesas-beta-frontend|mesas-beta-api|mesas-beta-db)$" | xargs -r docker rm -f || true
            
            # CORREÇÃO WF-04: Forçar remoção de containers existentes antes de recriar
            docker compose -f docker-compose.beta.yml down --remove-orphans
            docker rm -f mesas-beta-db mesas-beta-api mesas-beta-frontend 2>/dev/null || true
            docker compose -f docker-compose.beta.yml build --no-cache
            docker compose -f docker-compose.beta.yml up -d
            MAX_RETRIES=30
            RETRIES=0
            until docker compose -f docker-compose.beta.yml exec -T mesas-beta-db pg_isready -U admin -d mesas_rpg; do
              RETRIES=$((RETRIES+1))
              if [ $RETRIES -ge $MAX_RETRIES ]; then
                echo "❌ Banco não ficou pronto"
                docker compose -f docker-compose.beta.yml logs mesas-beta-db --tail=50
                exit 1
              fi
              sleep 3
            done
            sleep 20
            if ! docker compose -f docker-compose.beta.yml ps | grep "mesas-beta-api" | grep -q "Up"; then
              echo "❌ API não subiu"
              docker compose -f docker-compose.beta.yml logs mesas-beta-api --tail=50
              exit 1
            fi

            # CORREÇÃO E145: falhar deploy se frontend não atingir health=healthy
            FRONTEND_CONTAINER="mesas-beta-frontend"
            MAX_FRONTEND_RETRIES=20
            FRONTEND_RETRIES=0
            until [ "$(docker inspect --format '{{.State.Health.Status}}' "$FRONTEND_CONTAINER" 2>/dev/null || echo 'missing')" = "healthy" ]; do
              FRONTEND_RETRIES=$((FRONTEND_RETRIES+1))
              if [ $FRONTEND_RETRIES -ge $MAX_FRONTEND_RETRIES ]; then
                echo "❌ Frontend beta não ficou healthy (E145)"
                docker inspect "$FRONTEND_CONTAINER" --format '{{json .State.Health}}' || true
                docker compose -f docker-compose.beta.yml logs mesas-beta-frontend --tail=100
                exit 1
              fi
              sleep 3
            done
            
            # CORREÇÃO INT-03: Validar se frontend buildou com sucesso
            if ! docker compose -f docker-compose.beta.yml logs mesas-beta-frontend 2>&1 | grep -q "build completed"; then
              echo "⚠️ Verificando logs do frontend para possíveis erros de build"
              docker compose -f docker-compose.beta.yml logs mesas-beta-frontend --tail=100
            fi
            
            docker compose -f docker-compose.beta.yml ps
            docker image prune -f

      - name: Notify Success
        if: success()
        run: echo "✅ Deploy em beta concluído!"

      - name: Notify Failure
        if: failure()
        run: echo "❌ Deploy em beta falhou!"