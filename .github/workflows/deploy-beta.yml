name: Deploy Beta

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-beta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Beta Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GH_TOKEN
          script: |
            # CORREÇÃO WF-03: Adicionar fail-fast para evitar erros silenciosos
            set -euo pipefail

            # CORREÇÃO E146: lock de deploy para evitar corrida entre workflows simultâneos
            if ! command -v flock >/dev/null 2>&1; then
              echo "❌ flock não disponível no host; impossível garantir exclusão mútua do deploy beta"
              exit 1
            fi
            exec 9>/tmp/mesas-beta-deploy.lock
            if ! flock -w 600 9; then
              echo "❌ Timeout aguardando lock de deploy beta (E146)"
              exit 1
            fi

            export GH_TOKEN="${{ secrets.GH_TOKEN }}"
            cd /opt/mesas-beta

            if [ ! -f .env ]; then
              echo "❌ Arquivo /opt/mesas-beta/.env não encontrado"
              exit 1
            fi

            for required_key in VITE_API_URL VITE_CLOUDINARY_CLOUD_NAME VITE_CLOUDINARY_UPLOAD_PRESET; do
              required_value=$(awk -F= -v k="$required_key" '$1==k{print substr($0, index($0, "=")+1)}' .env | tail -n1 | tr -d '\r')
              if [ -z "$required_value" ]; then
                echo "❌ Variável obrigatória ausente no .env: $required_key"
                exit 1
              fi
            done

            git fetch https://$GH_TOKEN@github.com/FarenRavirar/mesas_rpg_artificio.git dev
            git reset --hard FETCH_HEAD
            
            # CORREÇÃO E146: usar apenas escopo compose para evitar colisões por prefixo
            docker compose -f docker-compose.beta.yml down --remove-orphans
            docker compose -f docker-compose.beta.yml build
            docker compose -f docker-compose.beta.yml up -d --force-recreate
            MAX_RETRIES=30
            RETRIES=0
            until docker compose -f docker-compose.beta.yml exec -T mesas-beta-db pg_isready -U admin -d mesas_rpg; do
              RETRIES=$((RETRIES+1))
              if [ $RETRIES -ge $MAX_RETRIES ]; then
                echo "❌ Banco não ficou pronto"
                docker compose -f docker-compose.beta.yml logs mesas-beta-db --tail=50
                exit 1
              fi
              sleep 3
            done

            # CORREÇÃO E147: falhar deploy se API não atingir health=healthy
            API_CONTAINER="mesas-beta-api"
            MAX_API_RETRIES=20
            API_RETRIES=0
            until [ "$(docker inspect --format '{{.State.Health.Status}}' "$API_CONTAINER" 2>/dev/null || echo 'missing')" = "healthy" ]; do
              API_RETRIES=$((API_RETRIES+1))
              if [ $API_RETRIES -ge $MAX_API_RETRIES ]; then
                echo "❌ API beta não ficou healthy (E147)"
                docker inspect "$API_CONTAINER" --format '{{json .State.Health}}' || true
                docker compose -f docker-compose.beta.yml logs mesas-beta-api --tail=100
                exit 1
              fi
              sleep 3
            done

            # CORREÇÃO E145: falhar deploy se frontend não atingir health=healthy
            FRONTEND_CONTAINER="mesas-beta-frontend"
            MAX_FRONTEND_RETRIES=20
            FRONTEND_RETRIES=0
            until [ "$(docker inspect --format '{{.State.Health.Status}}' "$FRONTEND_CONTAINER" 2>/dev/null || echo 'missing')" = "healthy" ]; do
              FRONTEND_RETRIES=$((FRONTEND_RETRIES+1))
              if [ $FRONTEND_RETRIES -ge $MAX_FRONTEND_RETRIES ]; then
                echo "❌ Frontend beta não ficou healthy (E145)"
                docker inspect "$FRONTEND_CONTAINER" --format '{{json .State.Health}}' || true
                docker compose -f docker-compose.beta.yml logs mesas-beta-frontend --tail=100
                exit 1
              fi
              sleep 3
            done
            # GATE BETA-01: validação externa obrigatória pós-deploy
            BETA_HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://mesasbeta.artificiorpg.com)
            if [ "$BETA_HTTP_CODE" != "200" ]; then
              echo "⚠️ Beta não respondeu HTTP 200. Tentando recuperação automática única..."
              docker compose -f docker-compose.beta.yml up -d --force-recreate
              sleep 20
              BETA_HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://mesasbeta.artificiorpg.com)
              if [ "$BETA_HTTP_CODE" != "200" ]; then
                echo "❌ Beta permaneceu fora após recuperação automática"
                docker compose -f docker-compose.beta.yml ps
                docker compose -f docker-compose.beta.yml logs --tail=120 mesas-beta-frontend mesas-beta-api mesas-beta-db
                exit 1
              fi
            fi

            if ! curl -fsS https://mesasbeta.artificiorpg.com/api/v1/health | grep -q '"status":"ok"'; then
              echo "⚠️ Health público do beta não retornou status ok. Tentando recuperação automática única..."
              docker compose -f docker-compose.beta.yml up -d --force-recreate
              sleep 20
              if ! curl -fsS https://mesasbeta.artificiorpg.com/api/v1/health | grep -q '"status":"ok"'; then
                echo "❌ Health público do beta segue inválido após recuperação"
                docker compose -f docker-compose.beta.yml ps
                docker compose -f docker-compose.beta.yml logs --tail=120 mesas-beta-frontend mesas-beta-api mesas-beta-db
                exit 1
              fi
            fi
            
            # CORREÇÃO INT-03: Validar se frontend buildou com sucesso
            if ! docker compose -f docker-compose.beta.yml logs mesas-beta-frontend 2>&1 | grep -q "build completed"; then
              echo "⚠️ Verificando logs do frontend para possíveis erros de build"
              docker compose -f docker-compose.beta.yml logs mesas-beta-frontend --tail=100
            fi
            
            docker compose -f docker-compose.beta.yml ps
            docker image prune -f
            docker builder prune -f --filter "until=168h"

      - name: Notify Success
        if: success()
        run: echo "✅ Deploy em beta concluído!"

      - name: Notify Failure
        if: failure()
        run: echo "❌ Deploy em beta falhou!"