# ============================================================================
# WORKFLOW: Deploy Beta
# RESPONSIBILITY: Continuous Deployment (Beta)
# TRIGGER: Push para branch dev (automático)
# SCOPE: Deploy completo para ambiente beta (migrations + containers + smoke tests)
# DEPENDENCIES: _enforce-migration-dir.yml, _lint-shell.yml
# CONSUMERS: Nenhum
# MAINTAINER: Equipe de operações
# LAST UPDATED: 2026-04-23
# NOTES: Único workflow autorizado a deployar para beta
# ============================================================================

name: Deploy Beta

on:
  push:
    branches:
      - dev

# Concurrency Policy:
# - cancel-in-progress: true → Cancels obsolete deploys when new commit arrives
# - Safe: flock in migrate job prevents cancellation during migration execution
# - Benefit: Faster feedback (5min vs 25min for 5 commits), reduced CI waste
concurrency:
  group: deploy-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce-dir:
    uses: ./.github/workflows/_enforce-migration-dir.yml

  lint:
    uses: ./.github/workflows/_lint-shell.yml

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Headers
        run: bash testes/deploy/header_contract.sh

  migrate:
    needs: [enforce-dir, lint, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Migrate Database
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/mesas-beta

            if ! command -v flock >/dev/null 2>&1; then
              echo "ERRO: flock nao disponivel"
              exit 1
            fi
            exec 9>/tmp/mesas-beta-deploy.lock
            if ! flock -w 120 9; then
              echo "ERRO: Timeout aguardando lock de deploy beta (E146)"
              exit 1
            fi

            # Sync code
            export GH_TOKEN="${{ secrets.GH_TOKEN }}"
            git fetch https://$GH_TOKEN@github.com/FarenRavirar/mesas_rpg_artificio.git dev
            git reset --hard FETCH_HEAD

            # Ensure DB is up and ready before migrating
            docker compose -f docker-compose.beta.yml up -d mesas-beta-db
            MAX_RETRIES=30
            RETRIES=0
            until docker compose -f docker-compose.beta.yml exec -T mesas-beta-db pg_isready -U admin -d mesas_rpg; do
              RETRIES=$((RETRIES+1))
              if [ $RETRIES -ge $MAX_RETRIES ]; then
                echo "ERRO: Banco nao ficou pronto"
                docker compose -f docker-compose.beta.yml logs mesas-beta-db --tail=50
                exit 1
              fi
              sleep 3
            done

            SNAPSHOT_FILE="/tmp/mesas-beta-predeploy-${{ github.run_id }}.dump"
            echo "Criando snapshot pré-deploy do banco beta em $SNAPSHOT_FILE"
            if ! timeout 60s docker exec mesas-beta-db pg_dump -U admin -d mesas_rpg -Fc -f /tmp/predeploy.dump; then
              echo "ERRO: Falha ao criar snapshot do banco beta"
              exit 1
            fi
            if ! docker cp mesas-beta-db:/tmp/predeploy.dump "$SNAPSHOT_FILE"; then
              echo "ERRO: Falha ao copiar snapshot do container para o host"
              exit 1
            fi
            docker exec mesas-beta-db rm -f /tmp/predeploy.dump

            # Run migrations
            bash ./scripts/deploy/apply_required_migrations.sh docker-compose.beta.yml mesas-beta-db

  deploy-app:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # CORRECAO WF-TS-01
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25.9.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: TypeScript check (frontend)
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Deploy App Containers
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PROD_DB_URL
          script: |
            set -euo pipefail
            exec 9>/tmp/mesas-beta-deploy.lock
            if ! flock -w 120 9; then exit 1; fi

            cd /opt/mesas-beta
            
            rollback() {
              echo "ROLLBACK: tentando resubir containers..."
              if ! docker compose -f docker-compose.beta.yml up -d --force-recreate; then
                echo "ERRO: rollback de containers falhou"
              fi
              echo "AVISO: Rollback tentado. Verificar estado manualmente."
            }
            trap rollback ERR

            docker compose -f docker-compose.beta.yml down --remove-orphans
            docker compose -f docker-compose.beta.yml build --no-cache
            trap - ERR
            docker compose -f docker-compose.beta.yml up -d --force-recreate

  smoke:
    needs: deploy-app
    runs-on: ubuntu-latest
    steps:
      - name: Smoke Tests
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PROD_DB_URL
          script: |
            set -euo pipefail
            cd /opt/mesas-beta

            exec 9>/tmp/mesas-beta-deploy.lock
            if ! flock -w 120 9; then
              echo "ERRO: Timeout aguardando lock de deploy beta durante smoke/rollback"
              exit 1
            fi

            API_CONTAINER="mesas-beta-api"
            MAX_API_RETRIES=20
            API_RETRIES=0
            until [ "$(docker inspect --format '{{.State.Health.Status}}' "$API_CONTAINER" 2>/dev/null || echo 'missing')" = "healthy" ]; do
              API_RETRIES=$((API_RETRIES+1))
              if [ $API_RETRIES -ge $MAX_API_RETRIES ]; then
                echo "ERRO: API beta nao ficou healthy (E147)"
                docker compose -f docker-compose.beta.yml logs mesas-beta-api --tail=100
                exit 1
              fi
              sleep 3
            done

            FRONTEND_CONTAINER="mesas-beta-frontend"
            MAX_FRONTEND_RETRIES=20
            FRONTEND_RETRIES=0
            until [ "$(docker inspect --format '{{.State.Health.Status}}' "$FRONTEND_CONTAINER" 2>/dev/null || echo 'missing')" = "healthy" ]; do
              FRONTEND_RETRIES=$((FRONTEND_RETRIES+1))
              if [ $FRONTEND_RETRIES -ge $MAX_FRONTEND_RETRIES ]; then
                echo "ERRO: Frontend beta nao ficou healthy (E145)"
                docker compose -f docker-compose.beta.yml logs mesas-beta-frontend --tail=100
                exit 1
              fi
              sleep 3
            done

            BETA_HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://mesasbeta.artificiorpg.com)
            if [ "$BETA_HTTP_CODE" != "200" ]; then exit 1; fi

            BETA_TABLES_URL="https://mesasbeta.artificiorpg.com/api/v1/tables?limit=1"
            BETA_SYSTEMS_TREE_URL="https://mesasbeta.artificiorpg.com/api/v1/systems?view=tree"
            BETA_OAUTH_URL="https://mesasbeta.artificiorpg.com/auth/google?frontend_redirect=https%3A%2F%2Fmesasbeta.artificiorpg.com"
            SNAPSHOT_FILE="/tmp/mesas-beta-predeploy-${{ github.run_id }}.dump"

            check_beta_critical_routes() {
              local tables_code systems_tree_code oauth_code

              if ! tables_code=$(curl -sS -o /tmp/beta_tables_check.json -w "%{http_code}" "$BETA_TABLES_URL"); then
                tables_code="000"
              fi
              if ! systems_tree_code=$(curl -sS -o /tmp/beta_systems_tree_check.json -w "%{http_code}" "$BETA_SYSTEMS_TREE_URL"); then
                systems_tree_code="000"
              fi
              if ! oauth_code=$(curl -sS -D /tmp/beta_oauth_check.headers -o /dev/null -w "%{http_code}" "$BETA_OAUTH_URL"); then
                oauth_code="000"
              fi

              if [ "$tables_code" != "200" ]; then return 1; fi
              if [ "$systems_tree_code" != "200" ]; then return 1; fi
              if [ "$oauth_code" != "302" ]; then return 1; fi
              return 0
            }

            restore_beta_snapshot() {
              if [ ! -f "$SNAPSHOT_FILE" ]; then
                echo "ERRO: Snapshot beta não encontrado em $SNAPSHOT_FILE"
                return 1
              fi

              echo "Restaurando snapshot do banco beta a partir de $SNAPSHOT_FILE"
              if ! docker cp "$SNAPSHOT_FILE" mesas-beta-db:/tmp/predeploy.dump; then
                echo "ERRO: Falha ao copiar snapshot para o container do banco"
                return 1
              fi

              if ! timeout 90s docker exec mesas-beta-db pg_restore -U admin -d mesas_rpg --clean --if-exists /tmp/predeploy.dump; then
                echo "ERRO: Falha ao restaurar snapshot no banco beta"
                return 1
              fi

              docker exec mesas-beta-db rm -f /tmp/predeploy.dump
              if ! docker compose -f docker-compose.beta.yml up -d --force-recreate; then
                echo "ERRO: Falha ao subir containers após restore do snapshot"
                return 1
              fi

              return 0
            }

            if ! check_beta_critical_routes; then
              echo "ERRO: Smoke tests falharam. Iniciando rollback completo (banco + containers)..."
              if ! restore_beta_snapshot; then
                echo "ERRO CRÍTICO: rollback automático falhou"
                docker compose -f docker-compose.beta.yml ps
                docker compose -f docker-compose.beta.yml logs mesas-beta-frontend mesas-beta-api mesas-beta-db --tail=120
                exit 1
              fi

              sleep 10
              if ! check_beta_critical_routes; then
                echo "ERRO CRÍTICO: rollback executado, mas rotas críticas seguem falhando"
                docker compose -f docker-compose.beta.yml ps
                docker compose -f docker-compose.beta.yml logs mesas-beta-frontend mesas-beta-api mesas-beta-db --tail=120
                exit 1
              fi

              echo "Rollback completo concluído com sucesso. Workflow será marcado como falha para alerta operacional."
              exit 1
            fi

            if [ -f "$SNAPSHOT_FILE" ]; then
              rm -f "$SNAPSHOT_FILE"
            fi

            docker compose -f docker-compose.beta.yml ps
            docker image prune -f
            docker builder prune -f --filter "until=168h"