name: Deploy Production

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mesas.artificiorpg.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          script: |
            cd /opt/mesas
            git pull origin main
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml build --no-cache
            
            # CORREÇÃO Bug #4: Substituir sleep 15 por verificação de health
            echo "🗄️ Subindo banco de dados..."
            docker compose -f docker-compose.prod.yml up -d mesas-db
            until docker compose -f docker-compose.prod.yml exec -T mesas-db pg_isready -U ${POSTGRES_USER:-admin} -d mesas_rpg; do
              echo "⏳ Aguardando banco ficar healthy..."
              sleep 3
            done
            echo "✅ Banco pronto!"
            
            # Subir resto dos serviços
            echo "🚀 Subindo aplicação..."
            docker compose -f docker-compose.prod.yml up -d
            
            # CORREÇÃO Bug #5: Verificar saúde dos containers
            echo "🔍 Verificando saúde dos containers..."
            sleep 10
            docker compose -f docker-compose.prod.yml ps
            
            if ! docker compose -f docker-compose.prod.yml ps | grep -E "(mesas-app|mesas-api)" | grep -q "Up"; then
              echo "❌ Erro: Containers não subiram corretamente"
              docker compose -f docker-compose.prod.yml logs --tail=50
              exit 1
            fi
            
            echo "✅ Todos os containers estão rodando!"
            echo "🧹 Limpando imagens antigas..."
            docker image prune -f
      
      - name: Notify Success
        if: success()
        run: echo "✅ Deploy em produção concluído!"
      
      - name: Notify Failure
        if: failure()
        run: echo "❌ Deploy em produção falhou!"
