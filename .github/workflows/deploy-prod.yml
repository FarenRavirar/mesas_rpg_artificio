name: Deploy Production

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mesas.artificiorpg.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          script: |
            cd /opt/mesas
            git pull origin main
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d mesas-db
            sleep 15
            docker exec mesas-api npm run migrate || echo "Migrations já aplicadas"
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml ps
            echo "🧹 Limpando imagens antigas..."
            docker image prune -f
      
      - name: Notify Success
        if: success()
        run: echo "✅ Deploy em produção concluído!"
      
      - name: Notify Failure
        if: failure()
        run: echo "❌ Deploy em produção falhou!"
