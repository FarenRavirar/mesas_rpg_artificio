name: Deploy Production

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mesas.artificiorpg.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          script: |
            set -euo pipefail
            cd /opt/mesas
            git fetch origin main
            git reset --hard origin/main
            
            # CORREÇÃO E144: NUNCA remover containers por prefixo global (name=mesas-)
            # Isso derruba beta (mesas-beta-*) por colisão de prefixo.
            # Limpeza de órfãos deve ser restrita ao projeto compose de produção.
            docker compose -f docker-compose.prod.yml down --remove-orphans
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d mesas-db
            MAX_RETRIES=30
            RETRIES=0
            until docker compose -f docker-compose.prod.yml exec -T mesas-db pg_isready -U admin -d mesas_rpg; do
              RETRIES=$((RETRIES+1))
              if [ $RETRIES -ge $MAX_RETRIES ]; then
                echo "❌ Banco não ficou pronto"
                docker compose -f docker-compose.prod.yml logs mesas-db --tail=50
                exit 1
              fi
              sleep 3
            done
            docker compose -f docker-compose.prod.yml up -d --force-recreate
            sleep 20
            if ! docker compose -f docker-compose.prod.yml ps | grep "mesas-api" | grep -q "Up"; then
              echo "❌ API não subiu"
              docker compose -f docker-compose.prod.yml logs mesas-api --tail=50
              exit 1
            fi

            # CORREÇÃO E145: falhar deploy se frontend não atingir health=healthy
            FRONTEND_CONTAINER="mesas-app"
            MAX_FRONTEND_RETRIES=20
            FRONTEND_RETRIES=0
            until [ "$(docker inspect --format '{{.State.Health.Status}}' "$FRONTEND_CONTAINER" 2>/dev/null || echo 'missing')" = "healthy" ]; do
              FRONTEND_RETRIES=$((FRONTEND_RETRIES+1))
              if [ $FRONTEND_RETRIES -ge $MAX_FRONTEND_RETRIES ]; then
                echo "❌ Frontend não ficou healthy (E145)"
                docker inspect "$FRONTEND_CONTAINER" --format '{{json .State.Health}}' || true
                docker compose -f docker-compose.prod.yml logs mesas-app --tail=100
                exit 1
              fi
              sleep 3
            done
            
            # CORREÇÃO INT-03: Validar se frontend buildou com sucesso
            if ! docker compose -f docker-compose.prod.yml logs mesas-app 2>&1 | grep -q "build completed"; then
              echo "⚠️ Verificando logs do frontend para possíveis erros de build"
              docker compose -f docker-compose.prod.yml logs mesas-app --tail=100
            fi
            
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f

      - name: Notify Success
        if: success()
        run: echo "✅ Deploy em produção concluído!"

      - name: Notify Failure
        if: failure()
        run: echo "❌ Deploy em produção falhou!"