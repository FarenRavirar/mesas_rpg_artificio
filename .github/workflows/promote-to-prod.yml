# ============================================================================
# WORKFLOW: Promote Beta to Production (CANONICAL)
# RESPONSIBILITY: Continuous Deployment (Production - Canonical)
# TRIGGER: Manual (workflow_dispatch) com input de versão
# SCOPE: Deploy PR-driven para produção (governance gate + deploy + release)
# DEPENDENCIES: _enforce-migration-dir.yml, _lint-shell.yml
# CONSUMERS: Nenhum
# MAINTAINER: Equipe de operações
# LAST UPDATED: 2026-04-23
# NOTES:
#   - WORKFLOW PRINCIPAL para deploy em produção (99% dos casos)
#   - Requer PR dev→main aprovado e merged
#   - Valida que dev não está à frente de main
#   - Cria release automática com notas
#   - Versionamento semântico obrigatório (ex: v0.1.1)
# ============================================================================

name: Promote Beta to Production (CANONICAL)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versao da release (ex: v0.1.1)'
        required: true
        type: string

concurrency:
  group: production-deploy-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # CORRECAO WF-TS-01 (promote): Validar TypeScript ANTES de promover para producao
  # Se o build falhar aqui, o deploy nao acontece e producao nao e afetada
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript check (frontend)
        run: npx tsc --noEmit
        working-directory: frontend

  enforce-dir:
    uses: ./.github/workflows/_enforce-migration-dir.yml

  lint:
    uses: ./.github/workflows/_lint-shell.yml

  governance_gate:
    needs: [typecheck, enforce-dir, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate promotion governance (PR-first)
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "ERRO: Promocao para producao deve ser executada a partir da branch main"
            echo "Promocao bloqueada: finalize o fluxo de PR dev -> main antes de disparar este workflow."
            exit 1
          fi

          git fetch origin main dev --prune
          AHEAD_BEHIND=$(git rev-list --left-right --count origin/main...origin/dev)
          MAIN_AHEAD=$(echo "$AHEAD_BEHIND" | awk '{print $1}')
          DEV_AHEAD=$(echo "$AHEAD_BEHIND" | awk '{print $2}')

          if [ "$DEV_AHEAD" -gt 0 ]; then
            echo "ERRO: branch dev esta ${DEV_AHEAD} commit(s) a frente da main."
            echo "Promocao bloqueada: abra/aprove PR dev -> main e refaca o workflow apos merge."
            exit 1
          fi

          if [ "$MAIN_AHEAD" -gt 0 ]; then
            echo "AVISO: main esta ${MAIN_AHEAD} commit(s) a frente de dev. Seguindo com promocao a partir de main."
          fi

          echo "Governanca validada: workflow executando a partir de main, sem pendencias de dev -> main."

  deploy:
    needs: governance_gate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mesas.artificiorpg.com

    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          script: |
            set -euo pipefail

            cd /opt/mesas
            git fetch origin main --tags
            git reset --hard origin/main

            # CORRECAO WF-ROLLBACK-01 (promote): rollback automatico se build falhar apos o down
            rollback() {
              echo "ROLLBACK: tentando resubir containers de producao..."
              if ! docker compose -f docker-compose.prod.yml up -d --force-recreate; then
                echo "ERRO: rollback de containers de producao falhou"
              fi
              echo "AVISO: Rollback tentado. Verificar estado manualmente."
            }
            trap rollback ERR

            # CORRECAO E144: NUNCA remover containers por prefixo global (name=mesas-)
            # Isso derruba beta (mesas-beta-*) por colisao de prefixo.
            docker compose -f docker-compose.prod.yml down --remove-orphans
            docker compose -f docker-compose.prod.yml build --no-cache
            trap - ERR

            docker compose -f docker-compose.prod.yml up -d mesas-db

            MAX_RETRIES=30
            RETRIES=0

            until docker compose -f docker-compose.prod.yml exec -T mesas-db pg_isready -U admin -d mesas_rpg; do
              RETRIES=$((RETRIES+1))
              if [ $RETRIES -ge $MAX_RETRIES ]; then
                echo "ERRO: Banco nao ficou pronto"
                docker compose -f docker-compose.prod.yml logs mesas-db --tail=50
                exit 1
              fi
              sleep 3
            done

            SNAPSHOT_FILE="/tmp/mesas-prod-predeploy-${{ github.run_id }}.dump"
            echo "Criando snapshot pré-deploy do banco de produção em $SNAPSHOT_FILE"
            if ! timeout 120s docker exec mesas-db pg_dump -U admin -d mesas_rpg -Fc -f /tmp/predeploy.dump; then
              echo "ERRO: Falha ao criar snapshot do banco de produção"
              exit 1
            fi
            if ! docker cp mesas-db:/tmp/predeploy.dump "$SNAPSHOT_FILE"; then
              echo "ERRO: Falha ao copiar snapshot para o host"
              exit 1
            fi
            docker exec mesas-db rm -f /tmp/predeploy.dump

            bash ./scripts/deploy/apply_required_migrations.sh docker-compose.prod.yml mesas-db

            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # CORRECAO WF-06: Validar health da API (healthy, nao apenas Up)
            API_CONTAINER="mesas-api"
            MAX_API_RETRIES=20
            API_RETRIES=0
            until [ "$(docker inspect --format '{{.State.Health.Status}}' "$API_CONTAINER" 2>/dev/null || echo 'missing')" = "healthy" ]; do
              API_RETRIES=$((API_RETRIES+1))
              if [ $API_RETRIES -ge $MAX_API_RETRIES ]; then
                echo "ERRO: API nao ficou healthy"
                docker inspect "$API_CONTAINER" --format '{{json .State.Health}}' || true
                docker compose -f docker-compose.prod.yml logs mesas-api --tail=100
                exit 1
              fi
              sleep 3
            done

            # CORRECAO E145 + nome correto do container: mesas-app (nao mesas-frontend)
            FRONTEND_CONTAINER="mesas-app"
            MAX_FRONTEND_RETRIES=20
            FRONTEND_RETRIES=0
            until [ "$(docker inspect --format '{{.State.Health.Status}}' "$FRONTEND_CONTAINER" 2>/dev/null || echo 'missing')" = "healthy" ]; do
              FRONTEND_RETRIES=$((FRONTEND_RETRIES+1))
              if [ $FRONTEND_RETRIES -ge $MAX_FRONTEND_RETRIES ]; then
                echo "ERRO: Frontend nao ficou healthy (E145)"
                docker inspect "$FRONTEND_CONTAINER" --format '{{json .State.Health}}' || true
                docker compose -f docker-compose.prod.yml logs mesas-app --tail=100
                exit 1
              fi
              sleep 3
            done

            PROD_TABLES_URL="https://mesas.artificiorpg.com/api/v1/tables?limit=1"
            PROD_SYSTEMS_TREE_URL="https://mesas.artificiorpg.com/api/v1/systems?view=tree"
            PROD_OAUTH_URL="https://mesas.artificiorpg.com/auth/google?frontend_redirect=https%3A%2F%2Fmesas.artificiorpg.com"

            check_prod_critical_routes() {
              local tables_code systems_tree_code oauth_code oauth_header_ok

              if ! tables_code=$(curl -sS -o /tmp/prod_tables_check.json -w "%{http_code}" "$PROD_TABLES_URL"); then
                tables_code="000"
              fi
              if ! systems_tree_code=$(curl -sS -o /tmp/prod_systems_tree_check.json -w "%{http_code}" "$PROD_SYSTEMS_TREE_URL"); then
                systems_tree_code="000"
              fi
              if ! oauth_code=$(curl -sS -D /tmp/prod_oauth_check.headers -o /dev/null -w "%{http_code}" "$PROD_OAUTH_URL"); then
                oauth_code="000"
              fi

              oauth_header_ok="no"
              if grep -qi '^location: https://accounts.google.com/o/oauth2/v2/auth' /tmp/prod_oauth_check.headers; then
                oauth_header_ok="yes"
              fi

              if [ "$tables_code" != "200" ]; then
                echo "ERRO: /api/v1/tables retornou HTTP $tables_code em producao (E150)"
                return 1
              fi

              if [ "$systems_tree_code" != "200" ]; then
                echo "ERRO: /api/v1/systems?view=tree retornou HTTP $systems_tree_code em producao (E150)"
                return 1
              fi

              if [ "$oauth_code" != "302" ] || [ "$oauth_header_ok" != "yes" ]; then
                echo "ERRO: /auth/google nao retornou redirect valido em producao (HTTP $oauth_code) (E150)"
                return 1
              fi

              return 0
            }

            restore_prod_snapshot() {
              if [ ! -f "$SNAPSHOT_FILE" ]; then
                echo "ERRO: Snapshot de produção não encontrado em $SNAPSHOT_FILE"
                return 1
              fi

              echo "Restaurando snapshot do banco de produção a partir de $SNAPSHOT_FILE"
              if ! docker cp "$SNAPSHOT_FILE" mesas-db:/tmp/predeploy.dump; then
                echo "ERRO: Falha ao copiar snapshot para container mesas-db"
                return 1
              fi

              if ! timeout 180s docker exec mesas-db pg_restore -U admin -d mesas_rpg --clean --if-exists /tmp/predeploy.dump; then
                echo "ERRO: Falha ao restaurar snapshot no banco de produção"
                return 1
              fi

              docker exec mesas-db rm -f /tmp/predeploy.dump
              if ! docker compose -f docker-compose.prod.yml up -d --force-recreate; then
                echo "ERRO: Falha ao subir containers após restore do snapshot"
                return 1
              fi

              return 0
            }

            if ! check_prod_critical_routes; then
              echo "ERRO: Rotas críticas de produção falharam. Coletando diagnóstico..."
              docker compose -f docker-compose.prod.yml logs mesas-app --tail=80 > /tmp/prod_frontend_failure.log
              docker compose -f docker-compose.prod.yml logs mesas-api --tail=80 > /tmp/prod_api_failure.log

              if grep -qi "ECONNREFUSED" /tmp/prod_frontend_failure.log; then
                echo "DIAGNÓSTICO: padrão E150 detectado (ECONNREFUSED). Tentando recovery específico..."
                docker restart mesas-app

                FRONTEND_RETRIES=0
                until [ "$(docker inspect --format '{{.State.Health.Status}}' "$FRONTEND_CONTAINER" 2>/dev/null || echo 'missing')" = "healthy" ]; do
                  FRONTEND_RETRIES=$((FRONTEND_RETRIES+1))
                  if [ $FRONTEND_RETRIES -ge $MAX_FRONTEND_RETRIES ]; then
                    echo "ERRO: Frontend não voltou healthy após recovery E150"
                    docker compose -f docker-compose.prod.yml logs mesas-app mesas-api --tail=120
                    break
                  fi
                  sleep 3
                done

                sleep 5
                if check_prod_critical_routes; then
                  echo "Recovery E150 concluído com sucesso"
                else
                  echo "ERRO: Recovery E150 não normalizou rotas críticas"
                fi
              else
                echo "DIAGNÓSTICO: falha não corresponde a E150. Recovery automático não aplicável."
              fi

              if ! check_prod_critical_routes; then
                echo "Iniciando rollback completo de produção (banco + containers)..."
                if ! restore_prod_snapshot; then
                  echo "ERRO CRÍTICO: rollback de produção falhou"
                  docker compose -f docker-compose.prod.yml ps
                  docker compose -f docker-compose.prod.yml logs mesas-app mesas-api mesas-db --tail=120
                  exit 1
                fi

                sleep 10
                if ! check_prod_critical_routes; then
                  echo "ERRO CRÍTICO: rollback executado, mas rotas críticas seguem falhando"
                  docker compose -f docker-compose.prod.yml ps
                  docker compose -f docker-compose.prod.yml logs mesas-app mesas-api mesas-db --tail=120
                  exit 1
                fi

                echo "Rollback completo de produção concluído com sucesso. Workflow será marcado como falha para alerta operacional."
                exit 1
              fi
            fi

            if [ -f "$SNAPSHOT_FILE" ]; then
              rm -f "$SNAPSHOT_FILE"
            fi

            docker compose -f docker-compose.prod.yml ps
            docker image prune -f

      - name: Notify Success
        if: success()
        run: echo "Promocao concluida! Versao ${{ inputs.version }}"

      - name: Notify Failure
        if: failure()
        run: echo "Falha na promocao!"

  release:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags origin

      # CORRECAO WF-05: Sincronizar com codigo deployado para garantir release notes corretas
      - name: Sync with deployed code
        run: |
          git fetch origin main --tags
          git checkout main

      - name: Descobrir ultima release de producao
        id: previous
        run: |
          PREVIOUS_TAG=$(gh release list \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName' || echo "")

          echo "tag=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"

      - name: Montar resumo executivo
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          set -euo pipefail

          TARGET_REF="origin/main"
          if git rev-parse --verify "${VERSION}" >/dev/null 2>&1; then
            TARGET_REF="${VERSION}"
          fi

          if [ -n "${PREVIOUS_TAG}" ]; then
            RANGE="${PREVIOUS_TAG}..${TARGET_REF}"
            git diff --name-only "${PREVIOUS_TAG}" "${TARGET_REF}" > changed_files.txt
          else
            RANGE="${TARGET_REF}"
            : > changed_files.txt
          fi

          TOTAL_COMMITS=$(git rev-list --count "${RANGE}" 2>/dev/null || echo 0)
          FEATURES=$(git log "${RANGE}" --pretty=format:'''%s''' | grep -Eci '''^(feat)(\(.+\))?:''' || true)
          FIXES=$(git log "${RANGE}" --pretty=format:'''%s''' | grep -Eci '''^(fix)(\(.+\))?:''' || true)
          REFACTORS=$(git log "${RANGE}" --pretty=format:'''%s''' | grep -Eci '''^(refactor|perf)(\(.+\))?:''' || true)
          CHORES=$(git log "${RANGE}" --pretty=format:'''%s''' | grep -Eci '''^(build|ci|chore|deps)(\(.+\))?:''' || true)

          {
            echo "## Resumo da versao ${VERSION}"
            echo

            if [ -n "${PREVIOUS_TAG}" ]; then
              echo "- Comparacao: \`${PREVIOUS_TAG}\` -> \`${VERSION}\`"
            else
              echo "- Primeira release publicada em producao"
            fi

            echo "- Total de commits: ${TOTAL_COMMITS}"
            echo "- Features: ${FEATURES}"
            echo "- Correcoes: ${FIXES}"
            echo "- Refatoracoes/performance: ${REFACTORS}"
            echo "- Infra/chore/deps: ${CHORES}"
            echo
            echo "### Areas impactadas"

            FOUND_AREA=0

            if grep -qE '''^frontend/''' changed_files.txt; then
              echo "- Frontend"
              FOUND_AREA=1
            fi

            if grep -qE '''^backend/''' changed_files.txt; then
              echo "- Backend"
              FOUND_AREA=1
            fi

            if grep -qE '''(^|/)(docker-compose|Dockerfile|\.github/workflows/)''' changed_files.txt; then
              echo "- Infra e deploy"
              FOUND_AREA=1
            fi

            if grep -qE '''(^|/)(migrations/|prisma/|db/|.*\.sql$)''' changed_files.txt; then
              echo "- Banco de dados"
              FOUND_AREA=1
            fi

            if grep -qE '''(^|/)(auth/|oauth|session|jwt|discord|google)''' changed_files.txt; then
              echo "- Autenticacao"
              FOUND_AREA=1
            fi

            if grep -qE '''\.md$''' changed_files.txt; then
              echo "- Documentacao"
              FOUND_AREA=1
            fi

            if [ "$FOUND_AREA" -eq 0 ]; then
              echo "- Escopo nao identificado automaticamente"
            fi

            echo
            echo "### Atencao operacional"

            ATTENTION=0

            if grep -qE '''(^|/)(migrations/|prisma/|db/|.*\.sql$)''' changed_files.txt; then
              echo "- Ha alteracoes que podem afetar banco de dados ou migracoes."
              ATTENTION=1
            fi

            if grep -qE '''(^|/)(docker-compose|Dockerfile|\.github/workflows/)''' changed_files.txt; then
              echo "- Ha alteracoes de infraestrutura ou deploy."
              ATTENTION=1
            fi

            if grep -qE '''(^|/)(auth/|oauth|session|jwt|discord|google)''' changed_files.txt; then
              echo "- Ha alteracoes em autenticacao, sessao ou permissoes."
              ATTENTION=1
            fi

            if [ "$ATTENTION" -eq 0 ]; then
              echo "- Sem alertas operacionais detectados automaticamente."
            fi

            echo
            echo "### Principais commits"
            git log "${RANGE}" --pretty=format:'''- %s (%h)''' -n 15
          } > executive_notes.md

      - name: Gerar notas automaticas do GitHub
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          set -euo pipefail

          if [ -n "${PREVIOUS_TAG}" ]; then
            gh api \
              repos/${{ github.repository }}/releases/generate-notes \
              -X POST \
              -f tag_name="${VERSION}" \
              -f target_commitish=main \
              -f previous_tag_name="${PREVIOUS_TAG}" \
              --jq '''.body''' > github_notes.md
          else
            gh api \
              repos/${{ github.repository }}/releases/generate-notes \
              -X POST \
              -f tag_name="${VERSION}" \
              -f target_commitish=main \
              --jq '''.body''' > github_notes.md
          fi

      - name: Consolidar release notes
        run: |
          {
            cat executive_notes.md
            echo
            echo "---"
            echo
            cat github_notes.md
          } > final_release_notes.md

      - name: Criar ou atualizar release
        run: |
          set -euo pipefail

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release edit "${VERSION}" \
              --title "Production ${VERSION}" \
              --notes-file final_release_notes.md \
              --latest
          else
            gh release create "${VERSION}" \
              --title "Production ${VERSION}" \
              --notes-file final_release_notes.md \
              --latest
          fi