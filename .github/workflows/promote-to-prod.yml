name: Promote Beta to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (ex: v0.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # CORREÇÃO Bug #3: Separar merge e deploy em jobs diferentes
  merge:
    name: Merge dev → main
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Merge dev to main
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout main
          git merge origin/dev --no-ff -m "chore: promote beta to production ${{ inputs.version }}"
          if ! git rev-parse ${{ inputs.version }} >/dev/null 2>&1; then
            git tag ${{ inputs.version }} -m "Release ${{ inputs.version }}"
          fi
          git push origin main
          git push origin ${{ inputs.version }} || echo "Tag já existe no remote"
      
      - name: Notify Merge Success
        if: success()
        run: echo "✅ Merge concluído com sucesso!"
      
      - name: Notify Merge Failure
        if: failure()
        run: echo "❌ Falha no merge! Deploy não será executado."

  deploy:
    name: Deploy to Production
    needs: merge  # CORREÇÃO Bug #3: Só roda se merge for bem-sucedido
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mesas.artificiorpg.com
    
    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          script: |
            cd /opt/mesas
            git pull origin main
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml build --no-cache
            
            # CORREÇÃO Bug #4: Substituir sleep 15 por verificação de health
            echo "🗄️ Subindo banco de dados..."
            docker compose -f docker-compose.prod.yml up -d mesas-db
            until docker compose -f docker-compose.prod.yml exec -T mesas-db pg_isready -U ${POSTGRES_USER:-admin} -d mesas_rpg; do
              echo "⏳ Aguardando banco ficar healthy..."
              sleep 3
            done
            echo "✅ Banco pronto!"
            
            # Subir resto dos serviços
            echo "🚀 Subindo aplicação..."
            docker compose -f docker-compose.prod.yml up -d
            
            # CORREÇÃO Bug #5: Verificar saúde dos containers
            echo "🔍 Verificando saúde dos containers..."
            sleep 10
            docker compose -f docker-compose.prod.yml ps
            
            if ! docker compose -f docker-compose.prod.yml ps | grep -E "(mesas-app|mesas-api)" | grep -q "Up"; then
              echo "❌ Erro: Containers não subiram corretamente"
              docker compose -f docker-compose.prod.yml logs --tail=50
              exit 1
            fi
            
            echo "✅ Todos os containers estão rodando!"
            echo "🧹 Limpando imagens antigas..."
            docker image prune -f
      
      - name: Notify Success
        if: success()
        run: echo "✅ Promoção para produção concluída! Versão ${{ inputs.version }}"
      
      - name: Notify Failure
        if: failure()
        run: echo "❌ Falha no deploy em produção!"
