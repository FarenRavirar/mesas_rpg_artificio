services:
  # FRONTEND (Nginx servindo build estático do React/Vite)
  # Roteado via Cloudflare Tunnel existente, sem porta pública exposta no host
  mesas-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://mesas.artificiorpg.com
        VITE_ENABLE_DEVTOOLS: ${VITE_ENABLE_DEVTOOLS:-false}
    container_name: mesas-app
    restart: always
    expose:
      - "80"
    networks:
      - gerenciador_telegram_default
    environment:
      - NODE_ENV=production
      - VITE_ENV=production
      - API_UPSTREAM=mesas-api
    depends_on:
      - mesas-api

  # BACKEND (Node.js API)
  # Variáveis de workers futuras ficam reservadas para fases posteriores
  mesas-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mesas-api
    restart: always
    expose:
      - "3000"
    networks:
      - gerenciador_telegram_default
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - PORT=3000
      # Banco de dados
      - DB_HOST=mesas-db
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=mesas_rpg
      - DATABASE_URL=${DATABASE_URL}
      # Autenticação
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=https://mesas.artificiorpg.com/api/v1/auth/google/callback
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_EXPIRES_IN=7d
      # App
      - FRONTEND_URL=https://mesas.artificiorpg.com
      # Imgur
      - IMGUR_CLIENT_ID=${IMGUR_CLIENT_ID}

    depends_on:
      mesas-db:
        condition: service_healthy
    # CORREÇÃO: Adicionar volume de logs (estava ausente no prod)
    volumes:
      - ./logs:/app/logs
    # CORREÇÃO Bug #6: Substituir deploy.resources por mem_limit (funciona com docker compose up)
    mem_limit: 512m
    memswap_limit: 512m
    # CORREÇÃO: Adicionar healthcheck na API
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # DATABASE (PostgreSQL)
  mesas-db:
    image: postgres:16-alpine
    container_name: mesas-db
    restart: always
    networks:
      - gerenciador_telegram_default
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mesas_rpg
    volumes:
      - pgdata_mesas_prod:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/00_init.sql
      - ./database/migration_01_base_schema.sql:/docker-entrypoint-initdb.d/01_base_schema.sql
      # CORREÇÃO Bug #7: Volume de logs removido — Postgres Alpine loga no stdout
      # Use: docker logs mesas-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d mesas_rpg"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_mesas_prod:

networks:
  gerenciador_telegram_default:
    external: true

