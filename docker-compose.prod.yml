services:
  mesas-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_ENABLE_DEVTOOLS: ${VITE_ENABLE_DEVTOOLS:-false}
    container_name: mesas-app
    restart: always
    expose:
      - "80"
    networks:
      - gerenciador_telegram_default
    environment:
      - NODE_ENV=production
      - VITE_ENV=production
      - API_UPSTREAM=mesas-api
    depends_on:
      - mesas-api

  mesas-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mesas-api
    restart: always
    expose:
      - "3000"
    networks:
      - gerenciador_telegram_default
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - PORT=3000
      - DB_HOST=mesas-db
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=mesas_rpg
      - DATABASE_URL=${DATABASE_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=https://mesas.artificiorpg.com/api/v1/auth/google/callback
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_EXPIRES_IN=7d
      - FRONTEND_URL=https://mesas.artificiorpg.com
      - IMGUR_CLIENT_ID=${IMGUR_CLIENT_ID}
    depends_on:
      mesas-db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  mesas-db:
    image: postgres:16-alpine
    container_name: mesas-db
    restart: always
    networks:
      - gerenciador_telegram_default
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mesas_rpg
    volumes:
      - pgdata_mesas_prod:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/00_init.sql
      - ./database/migration_01_base_schema.sql:/docker-entrypoint-initdb.d/01_base_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d mesas_rpg"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_mesas_prod:

networks:
  gerenciador_telegram_default:
    external: true