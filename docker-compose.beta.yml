services:
  # FRONTEND (Nginx servindo build estático do React/Vite)
  # Roteado via Cloudflare Tunnel existente, sem porta pública exposta no host
  # CORREÇÃO WF-01: Service name deve corresponder ao container_name para consistência
  mesas-beta-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_ENABLE_DEVTOOLS: ${VITE_ENABLE_DEVTOOLS:-true}
    container_name: mesas-beta-frontend
    restart: always
    expose:
      - "80"
    networks:
      - gerenciador_telegram_default
    environment:
      - NODE_ENV=production
      - VITE_ENV=beta
      - API_UPSTREAM=mesas-beta-api
    depends_on:
      - mesas-beta-api

  # BACKEND (Node.js API)
  # Variáveis de workers futuras ficam reservadas para fases posteriores
  mesas-beta-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mesas-beta-api
    restart: always
    expose:
      - "3000"
    networks:
      - gerenciador_telegram_default
    environment:
      - NODE_ENV=production
      - APP_ENV=beta
      - PORT=3000
      # Banco de dados
      - DB_HOST=mesas-beta-db
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=mesas_rpg
      - DATABASE_URL=${DATABASE_URL}
      # Autenticação
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=https://mesasbeta.artificiorpg.com/api/v1/auth/google/callback
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_EXPIRES_IN=7d
      # App
      - FRONTEND_URL=https://mesasbeta.artificiorpg.com
      # Imgur
      - IMGUR_CLIENT_ID=${IMGUR_CLIENT_ID}

    depends_on:
      mesas-beta-db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs  # Logs persistentes fora do container
    # CORREÇÃO: Adicionar healthcheck na API
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # CORREÇÃO: Limitar recursos para evitar OOM
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  # DATABASE (PostgreSQL)
  mesas-beta-db:
    image: postgres:16-alpine
    container_name: mesas-beta-db
    restart: always
    networks:
      - gerenciador_telegram_default
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mesas_rpg
    volumes:
      - pgdata_mesas_beta:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/00_init.sql
      - ./database/migration_01_base_schema.sql:/docker-entrypoint-initdb.d/01_base_schema.sql
      # CORREÇÃO: Adicionar volume de logs para diagnóstico
      - ./logs/db:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d mesas_rpg"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_mesas_beta:

networks:
  gerenciador_telegram_default:
    external: true